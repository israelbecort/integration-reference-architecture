asyncapi: 3.1.0

id: urn:israelbecort:order-integration-events

info:
  title: Order Integration Events API
  version: 1.0.0
  description: |
    Event-driven interface used by the fictional order integration platform.

    The Integration Service publishes order domain events to Apache Kafka.
    The ERP consumes these events asynchronously.

    The purpose of this specification is to formally document the messaging
    contract, Kafka channel, producer, consumer, message structure,
    correlation strategy and Kafka message key.

  license:
    name: MIT

defaultContentType: application/json

servers:

  localKafka:
    host: localhost:9092
    protocol: kafka
    description: Local Apache Kafka broker used for development.

    bindings:
      kafka:
        bindingVersion: '0.5.0'


channels:

  orderEvents:
    address: orders.events.v1

    title: Order Events

    summary: Kafka topic containing events related to the order domain.

    description: |
      This channel is used to exchange events associated with the lifecycle
      of an order.

      The initial implementation supports the ORDER_CREATED event.

      Additional order lifecycle events may be introduced in future versions.

    messages:

      orderCreated:
        $ref: '#/components/messages/OrderCreated'


operations:

  publishOrderCreated:

    action: send

    title: Publish Order Created Event

    summary: Integration Service publishes an ORDER_CREATED event.

    description: |
      The Integration Service publishes this event after the order has
      successfully completed the required synchronous processing.

      The ERP does not need to be available when the event is published.

    channel:
      $ref: '#/channels/orderEvents'

    messages:
      - $ref: '#/channels/orderEvents/messages/orderCreated'

    bindings:

      kafka:

        clientId:
          type: string
          enum:
            - integration-service

        bindingVersion: '0.5.0'


  consumeOrderCreated:

    action: receive

    title: Consume Order Created Event

    summary: ERP consumes an ORDER_CREATED event.

    description: |
      The ERP consumes order events asynchronously from Kafka.

      The consumer must be idempotent because Kafka messages may be
      delivered more than once.

    channel:
      $ref: '#/channels/orderEvents'

    messages:
      - $ref: '#/channels/orderEvents/messages/orderCreated'

    bindings:

      kafka:

        groupId:
          type: string
          enum:
            - erp-order-consumer

        clientId:
          type: string
          enum:
            - erp-mock

        bindingVersion: '0.5.0'


components:

  messages:

    OrderCreated:

      name: OrderCreated

      title: Order Created Event

      summary: Event generated when an order is accepted for asynchronous processing.

      description: |
        Represents an order that has been accepted by the integration
        platform and is ready for downstream ERP processing.

      contentType: application/json

      correlationId:

        description: |
          Correlation identifier propagated through the complete
          integration transaction.

        location: '$message.payload#/correlationId'

      payload:
        $ref: '#/components/schemas/OrderCreatedEvent'

      bindings:

        kafka:

          key:

            type: string
            format: uuid

            description: |
              The Kafka message key contains the orderId.

              Using the orderId as the Kafka key ensures that events
              associated with the same order are routed to the same
              Kafka partition.

          bindingVersion: '0.5.0'

      examples:

        - name: OrderCreatedExample

          summary: Example of an order accepted for ERP processing.

          payload:

            eventId: 90b9f215-c19f-4abc-a2c4-2cc7220c010d

            eventType: ORDER_CREATED

            eventVersion: "1.0"

            occurredAt: "2026-09-05T07:15:00Z"

            correlationId: b37166f4-8a39-4ffd-9599-c42ca48b83d0

            source: integration-service

            data:

              orderId: 33c58292-f36e-4ca3-a421-c22da73e93e5

              externalOrderId: WEB-2026-000123

              customerId: CUST-10045

              currency: EUR

              items:

                - productId: PROD-001
                  quantity: 2
                  unitPrice: 29.95

                - productId: PROD-002
                  quantity: 1
                  unitPrice: 15.50

              shippingAddress:

                addressLine1: 123 Example Street

                city: Seville

                postalCode: "41001"

                country: ES


  schemas:

    OrderCreatedEvent:

      type: object

      additionalProperties: false

      required:
        - eventId
        - eventType
        - eventVersion
        - occurredAt
        - correlationId
        - source
        - data

      properties:

        eventId:

          type: string
          format: uuid

          description: |
            Unique identifier of this specific event.

            Consumers may use this identifier to detect duplicate
            message delivery.

          example: 90b9f215-c19f-4abc-a2c4-2cc7220c010d


        eventType:

          type: string
          const: ORDER_CREATED

          description: Business event represented by the message.

          example: ORDER_CREATED


        eventVersion:

          type: string
          const: "1.0"

          description: Version of the event contract.

          example: "1.0"


        occurredAt:

          type: string
          format: date-time

          description: |
            Timestamp indicating when the business event occurred.

          example: "2026-09-05T07:15:00Z"


        correlationId:

          type: string
          format: uuid

          description: |
            Identifier propagated across the complete integration flow
            for tracing and observability.

          example: b37166f4-8a39-4ffd-9599-c42ca48b83d0


        source:

          type: string
          const: integration-service

          description: Component that produced the event.

          example: integration-service


        data:

          $ref: '#/components/schemas/OrderData'


    OrderData:

      type: object

      additionalProperties: false

      required:
        - orderId
        - externalOrderId
        - customerId
        - currency
        - items
        - shippingAddress

      properties:

        orderId:

          type: string
          format: uuid

          description: |
            Internal identifier assigned to the order.

            This identifier is also used as the Kafka message key.

          example: 33c58292-f36e-4ca3-a421-c22da73e93e5


        externalOrderId:

          type: string
          minLength: 1
          maxLength: 100

          description: |
            Order identifier generated by the source e-commerce platform.

          example: WEB-2026-000123


        customerId:

          type: string
          minLength: 1
          maxLength: 100

          description: Identifier of the customer associated with the order.

          example: CUST-10045


        currency:

          type: string
          pattern: '^[A-Z]{3}$'

          description: ISO 4217 currency code.

          example: EUR


        items:

          type: array
          minItems: 1

          description: Products included in the order.

          items:
            $ref: '#/components/schemas/OrderItem'


        shippingAddress:

          $ref: '#/components/schemas/ShippingAddress'


    OrderItem:

      type: object

      additionalProperties: false

      required:
        - productId
        - quantity
        - unitPrice

      properties:

        productId:

          type: string
          minLength: 1
          maxLength: 100

          description: Identifier of the product.

          example: PROD-001


        quantity:

          type: integer
          minimum: 1

          description: Number of product units.

          example: 2


        unitPrice:

          type: number
          minimum: 0.01

          description: Price per product unit.

          example: 29.95


    ShippingAddress:

      type: object

      additionalProperties: false

      required:
        - addressLine1
        - city
        - postalCode
        - country

      properties:

        addressLine1:

          type: string
          minLength: 1
          maxLength: 200

          example: 123 Example Street


        addressLine2:

          type: string
          maxLength: 200

          example: Apartment 4B


        city:

          type: string
          minLength: 1
          maxLength: 100

          example: Seville


        postalCode:

          type: string
          minLength: 1
          maxLength: 20

          example: "41001"


        country:

          type: string
          pattern: '^[A-Z]{2}$'

          description: ISO 3166-1 alpha-2 country code.

          example: ES
