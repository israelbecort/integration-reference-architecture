openapi: 3.0.3

info:
  title: Integration Service API
  version: 1.0.0
  description: |
    Internal REST API used by the Order API to initiate enterprise
    integration processing for an accepted order.

    The Integration Service acts as the orchestration layer between
    the Order API and downstream enterprise systems.

    Its responsibilities include:

    - Correlation propagation
    - Integration orchestration
    - Data transformation
    - Synchronous CRM integration
    - Asynchronous Kafka event publication
    - Resilience and downstream error handling

    This API is intended for internal service-to-service communication
    and is not exposed directly to external consumers.

  contact:
    name: Israel Becerra Ortiz
    url: https://www.linkedin.com/in/israelbecerraortiz/

  license:
    name: MIT

servers:
  - url: http://localhost:8081
    description: Local development environment

tags:
  - name: Order Processing
    description: Internal order integration processing operations

paths:

  /internal/v1/orders/{orderId}/process:

    post:
      tags:
        - Order Processing

      summary: Process an accepted order

      operationId: processOrder

      description: |
        Receives an order that has already been validated and accepted
        by the Order API.

        The orderId path parameter is the stable internal identifier
        generated by the Order API.

        The external Idempotency-Key is not propagated to this API.

        Internal processing uses orderId as the identity of the order.

        The X-Correlation-Id header is mandatory and must be propagated
        across downstream integrations.

        A successful response indicates that the Integration Service has
        accepted responsibility for continuing the integration workflow.

        ERP processing remains asynchronous.

      parameters:

        - $ref: '#/components/parameters/OrderIdPath'

        - $ref: '#/components/parameters/CorrelationIdHeader'

      requestBody:
        required: true

        description: |
          Normalized order information provided by the Order API.

        content:

          application/json:

            schema:
              $ref: '#/components/schemas/ProcessOrderRequest'

            example:
              externalOrderId: WEB-2026-000123

              customer:
                customerId: CUST-10045
                email: customer@example.com

              items:
                - productId: PROD-001
                  quantity: 2
                  unitPrice: 29.95

              currency: EUR

              shippingAddress:
                addressLine1: 123 Example Street
                city: Seville
                postalCode: "41001"
                country: ES

              acceptedAt: "2026-09-07T10:00:00Z"

      responses:

        '202':
          description: |
            The Integration Service has accepted responsibility for
            continuing processing of the order.

            The PROCESSING status does not mean that asynchronous ERP
            processing has completed.

          headers:

            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponseHeader'

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ProcessOrderAcceptedResponse'

              example:
                orderId: b243423f-8047-49ea-b79f-50027400c022
                status: PROCESSING
                correlationId: 11111111-1111-4111-8111-111111111111
                processingAcceptedAt: "2026-09-07T10:00:01Z"

        '400':
          description: |
            The internal request cannot be processed because its
            structure, identifiers, headers or field values are invalid.

          headers:

            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponseHeader'

          content:

            application/problem+json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

              examples:

                validationError:
                  summary: Request validation error

                  value:
                    type: https://example.com/problems/integration-validation
                    title: Integration request validation failed
                    status: 400
                    detail: One or more request fields are invalid.
                    instance: /internal/v1/orders/b243423f-8047-49ea-b79f-50027400c022/process
                    errorCode: INT-VALIDATION-001
                    correlationId: 11111111-1111-4111-8111-111111111111
                    timestamp: "2026-09-07T10:00:01Z"

                malformedJson:
                  summary: Malformed JSON request

                  value:
                    type: https://example.com/problems/integration-validation
                    title: Integration request validation failed
                    status: 400
                    detail: The request body is malformed or contains invalid data.
                    instance: /internal/v1/orders/b243423f-8047-49ea-b79f-50027400c022/process
                    errorCode: INT-VALIDATION-002
                    correlationId: 11111111-1111-4111-8111-111111111111
                    timestamp: "2026-09-07T10:00:01Z"

                missingCorrelationId:
                  summary: Missing correlation identifier

                  value:
                    type: https://example.com/problems/integration-validation
                    title: Required header missing
                    status: 400
                    detail: Required header 'X-Correlation-Id' is missing.
                    instance: /internal/v1/orders/b243423f-8047-49ea-b79f-50027400c022/process
                    errorCode: INT-VALIDATION-003
                    correlationId: 11111111-1111-4111-8111-111111111111
                    timestamp: "2026-09-07T10:00:01Z"

                invalidIdentifier:
                  summary: Invalid UUID value

                  value:
                    type: https://example.com/problems/integration-validation
                    title: Invalid request value
                    status: 400
                    detail: One or more request identifiers have an invalid format.
                    instance: /internal/v1/orders/invalid/process
                    errorCode: INT-VALIDATION-004
                    correlationId: 11111111-1111-4111-8111-111111111111
                    timestamp: "2026-09-07T10:00:01Z"

        '409':
          description: |
            The request conflicts with previously known information
            associated with the same orderId.

            This status is reserved for internal duplicate-processing
            conflicts such as the same orderId being associated with
            incompatible order content.

          headers:

            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponseHeader'

          content:

            application/problem+json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

              example:
                type: https://example.com/problems/integration-conflict
                title: Integration processing conflict
                status: 409
                detail: The order conflicts with previously accepted processing information.
                instance: /internal/v1/orders/b243423f-8047-49ea-b79f-50027400c022/process
                errorCode: INT-CONFLICT-001
                correlationId: 11111111-1111-4111-8111-111111111111
                timestamp: "2026-09-07T10:00:01Z"

        '422':
          description: |
            The request is structurally valid but cannot be processed
            because of an integration or business rule.

          headers:

            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponseHeader'

          content:

            application/problem+json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

              example:
                type: https://example.com/problems/integration-business-rule
                title: Integration business validation failed
                status: 422
                detail: The order cannot transition to the requested processing state.
                instance: /internal/v1/orders/b243423f-8047-49ea-b79f-50027400c022/process
                errorCode: INT-BUSINESS-001
                correlationId: 11111111-1111-4111-8111-111111111111
                timestamp: "2026-09-07T10:00:01Z"

        '503':
          description: |
            A required downstream integration dependency is temporarily
            unavailable.

            Potential dependencies include the CRM API and Kafka broker.

          headers:

            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponseHeader'

          content:

            application/problem+json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

              example:
                type: https://example.com/problems/integration-dependency-unavailable
                title: Integration dependency unavailable
                status: 503
                detail: A required downstream integration dependency is temporarily unavailable.
                instance: /internal/v1/orders/b243423f-8047-49ea-b79f-50027400c022/process
                errorCode: INT-DEPENDENCY-001
                correlationId: 11111111-1111-4111-8111-111111111111
                timestamp: "2026-09-07T10:00:01Z"

        '500':
          description: Unexpected internal integration error.

          headers:

            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponseHeader'

          content:

            application/problem+json:

              schema:
                $ref: '#/components/schemas/ProblemDetails'

              example:
                type: https://example.com/problems/integration-internal-error
                title: Internal integration error
                status: 500
                detail: An unexpected technical error occurred.
                instance: /internal/v1/orders/b243423f-8047-49ea-b79f-50027400c022/process
                errorCode: INT-INTERNAL-001
                correlationId: 11111111-1111-4111-8111-111111111111
                timestamp: "2026-09-07T10:00:01Z"


components:

  parameters:

    OrderIdPath:
      name: orderId
      in: path
      required: true

      description: |
        Internal order identifier generated by the Order API.

        The orderId is the stable identity used throughout internal
        integration processing.

      schema:
        type: string
        format: uuid

      example: b243423f-8047-49ea-b79f-50027400c022


    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: true

      description: |
        UUID used to trace the distributed integration flow.

        The value is generated or accepted by the Order API and must be
        propagated unchanged by internal services.

      schema:
        type: string
        format: uuid

      example: 11111111-1111-4111-8111-111111111111


  headers:

    CorrelationIdResponseHeader:
      description: |
        Correlation identifier associated with the current integration
        request.

      schema:
        type: string
        format: uuid

      example: 11111111-1111-4111-8111-111111111111


  schemas:

    ProcessOrderRequest:
      type: object

      additionalProperties: false

      required:
        - externalOrderId
        - customer
        - items
        - currency
        - shippingAddress
        - acceptedAt

      properties:

        externalOrderId:
          type: string
          minLength: 1
          maxLength: 100

          description: |
            Order identifier assigned by the source e-commerce platform.

          example: WEB-2026-000123


        customer:
          $ref: '#/components/schemas/Customer'


        items:
          type: array
          minItems: 1

          description: Products included in the order.

          items:
            $ref: '#/components/schemas/OrderItem'


        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'

          description: ISO 4217 currency code.

          example: EUR


        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'


        acceptedAt:
          type: string
          format: date-time

          description: |
            Timestamp generated by the Order API when the order was
            originally accepted.

          example: "2026-09-07T10:00:00Z"


    Customer:
      type: object

      additionalProperties: false

      required:
        - customerId
        - email

      properties:

        customerId:
          type: string
          minLength: 1
          maxLength: 100

          description: Customer identifier.

          example: CUST-10045


        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254

          description: Customer email address.

          example: customer@example.com


    OrderItem:
      type: object

      additionalProperties: false

      required:
        - productId
        - quantity
        - unitPrice

      properties:

        productId:
          type: string
          minLength: 1
          maxLength: 100

          description: Product identifier.

          example: PROD-001


        quantity:
          type: integer
          minimum: 1

          description: Number of product units.

          example: 2


        unitPrice:
          type: number
          minimum: 0.01

          description: Price per product unit.

          example: 29.95


    ShippingAddress:
      type: object

      additionalProperties: false

      required:
        - addressLine1
        - city
        - postalCode
        - country

      properties:

        addressLine1:
          type: string
          minLength: 1
          maxLength: 200

          example: 123 Example Street


        addressLine2:
          type: string
          maxLength: 200

          example: Apartment 4B


        city:
          type: string
          minLength: 1
          maxLength: 100

          example: Seville


        postalCode:
          type: string
          minLength: 1
          maxLength: 20

          example: "41001"


        country:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'

          description: ISO 3166-1 alpha-2 country code.

          example: ES


    ProcessOrderAcceptedResponse:
      type: object

      additionalProperties: false

      required:
        - orderId
        - status
        - correlationId
        - processingAcceptedAt

      properties:

        orderId:
          type: string
          format: uuid

          description: Internal order identifier.

          example: b243423f-8047-49ea-b79f-50027400c022


        status:
          type: string

          description: |
            Integration processing state returned after the Integration
            Service accepts responsibility for the order.

          enum:
            - PROCESSING

          example: PROCESSING


        correlationId:
          type: string
          format: uuid

          description: |
            Correlation identifier propagated from the incoming request.

          example: 11111111-1111-4111-8111-111111111111


        processingAcceptedAt:
          type: string
          format: date-time

          description: |
            Timestamp when the Integration Service accepted responsibility
            for continuing the integration workflow.

          example: "2026-09-07T10:00:01Z"


    ProblemDetails:
      type: object

      additionalProperties: false

      required:
        - type
        - title
        - status
        - detail
        - instance
        - errorCode
        - correlationId
        - timestamp

      properties:

        type:
          type: string
          format: uri

          description: URI identifying the error category.

          example: https://example.com/problems/integration-validation


        title:
          type: string

          description: Short human-readable description of the error.

          example: Integration request validation failed


        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599

          description: HTTP status code.

          example: 400


        detail:
          type: string

          description: Human-readable explanation of the error.

          example: One or more request fields are invalid.


        instance:
          type: string

          description: Internal API resource where the error occurred.

          example: /internal/v1/orders/b243423f-8047-49ea-b79f-50027400c022/process


        errorCode:
          type: string

          description: |
            Stable integration error code that can be consumed by callers,
            logs and operational tooling.

          example: INT-VALIDATION-001


        correlationId:
          type: string
          format: uuid
          nullable: true

          description: |
            Correlation identifier associated with the failure.

            The value may be null when the incoming X-Correlation-Id header
            is missing or cannot be parsed as a valid UUID.

          example: 11111111-1111-4111-8111-111111111111


        timestamp:
          type: string
          format: date-time

          description: Time when the error response was generated.

          example: "2026-09-07T10:00:01Z"