services:
  postgres:
    image: postgres:17-alpine
    container_name: integration-reference-postgres

    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass

    ports:
      - "5432:5432"

    volumes:
      - order-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  order-postgres-data: